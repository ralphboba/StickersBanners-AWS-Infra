<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StickersBanners — Orders</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --mut:#6b7686; --line:#e3e7ee;
          --blue:#2563eb; --green:#16a34a; --red:#dc2626; --amber:#d97706; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:var(--card); border-bottom:1px solid var(--line);
           padding:14px 24px; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:17px; margin:0; }
  header .spacer { flex:1; }
  header .who { color:var(--mut); font-size:13px; }
  main { max-width:1100px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:20px; }
  button { font:inherit; border:1px solid var(--line); background:var(--card);
           border-radius:8px; padding:8px 14px; cursor:pointer; }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
  button.approve { background:var(--green); border-color:var(--green); color:#fff; }
  button.reject  { background:var(--red);   border-color:var(--red);   color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  input { font:inherit; border:1px solid var(--line); border-radius:8px;
          padding:9px 12px; width:100%; }
  label { display:block; font-size:13px; color:var(--mut); margin:12px 0 4px; }
  /* login */
  #login { max-width:360px; margin:10vh auto; }
  #login h2 { margin-top:0; }
  #login button { width:100%; margin-top:16px; }
  .err { color:var(--red); font-size:13px; min-height:18px; margin-top:10px; }
  /* tabs */
  .tabs { display:flex; gap:8px; margin:0 0 16px; flex-wrap:wrap; }
  .tabs button { border-radius:999px; padding:7px 14px; font-size:13.5px; }
  .tabs button.on { background:var(--ink); border-color:var(--ink); color:#fff; }
  .tabs .n { opacity:.65; margin-left:4px; }
  /* table */
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:600; font-size:12.5px; text-transform:uppercase;
       letter-spacing:.04em; }
  tr.row { cursor:pointer; } tr.row:hover { background:#f0f4fa; }
  .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px;
          font-weight:600; }
  .s-received    { background:#e0edff; color:#1d4ed8; }
  .s-processing  { background:#fef3c7; color:#92400e; }
  .s-manual_hold { background:#fde8e8; color:#b91c1c; }
  .s-done        { background:#dcfce7; color:#166534; }
  .s-failed      { background:#fee2e2; color:#991b1b; }
  .mut { color:var(--mut); }
  .empty { color:var(--mut); text-align:center; padding:32px 0; }
  /* detail */
  #detail { margin-top:16px; }
  #detail h3 { margin:0 0 4px; }
  dl { display:grid; grid-template-columns:140px 1fr; gap:6px 12px; margin:14px 0; }
  dt { color:var(--mut); font-size:13px; } dd { margin:0; }
  .actions { display:flex; gap:10px; margin-top:16px; align-items:center; }
  .actions input { width:260px; }
  .note { font-size:13px; color:var(--mut); margin-top:10px; }
  .items td { border-bottom:none; padding:4px 12px 4px 0; font-size:13.5px; }
</style>
</head>
<body>

<!-- CONFIG is loaded from config.json, which is generated automatically at
     deploy time (webapp stack). Staff never edit anything — they just visit
     the hosted URL. Falls back to empty when opened as a bare file. -->
<script>
let CONFIG = { region: 'us-east-1', apiBase: '', userPoolClientId: '', cdnBase: '' };
</script>

<header hidden id="topbar">
  <h1>StickersBanners Orders</h1>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
  <button id="signout">Sign out</button>
</header>

<div id="login" class="card">
  <h2>Staff sign in</h2>
  <label>Username</label><input id="email" type="text" autocomplete="username">
  <label>Password</label><input id="password" type="password" autocomplete="current-password">
  <button class="primary" id="signin">Sign in</button>
  <div class="err" id="loginErr"></div>
</div>

<main hidden id="app">
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <table>
      <thead><tr><th>Order</th><th>Customer</th><th>Facility</th><th>Proof?</th><th>Created</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No orders in this status.</div>
  </div>

  <div class="card" id="detail" hidden></div>
</main>

<script>
const STATUSES = ['received','processing','manual_hold','done','failed'];
let token = null, currentStatus = 'processing';

const $ = (id) => document.getElementById(id);

/* ---------- auth (Cognito USER_PASSWORD_AUTH via plain fetch) ---------- */
async function signIn(email, password) {
  const r = await fetch(`https://cognito-idp.${CONFIG.region}.amazonaws.com/`, {
    method: 'POST',
    headers: { 'content-type': 'application/x-amz-json-1.1',
               'x-amz-target': 'AWSCognitoIdentityProviderService.InitiateAuth' },
    body: JSON.stringify({
      AuthFlow: 'USER_PASSWORD_AUTH',
      ClientId: CONFIG.userPoolClientId,
      AuthParameters: { USERNAME: email, PASSWORD: password },
    }),
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.message || 'sign-in failed');
  if (!data.AuthenticationResult) throw new Error('additional challenge required — finish setup in the AWS console first');
  return data.AuthenticationResult.IdToken;
}

/* ---------------------------- API helpers ------------------------------ */
async function api(path, opts = {}) {
  const r = await fetch(CONFIG.apiBase + path, {
    ...opts,
    headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json',
               ...(opts.headers || {}) },
  });
  if (r.status === 401) { location.reload(); return; }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

/* ------------------------------- views --------------------------------- */
function renderTabs(counts = {}) {
  $('tabs').innerHTML = STATUSES.map(s =>
    `<button class="${s === currentStatus ? 'on' : ''}" data-s="${s}">
       ${s.replace('_',' ')}${counts[s] != null ? `<span class="n">${counts[s]}</span>` : ''}
     </button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b =>
    b.onclick = () => { currentStatus = b.dataset.s; $('detail').hidden = true; loadList(); });
}

function fmtDate(iso) { return iso ? new Date(iso).toLocaleString() : '—'; }
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function loadList() {
  renderTabs();
  const data = await api(`/orders?status=${currentStatus}`);
  const rows = data.orders.map(o => `
    <tr class="row" data-n="${esc(o.orderName)}">
      <td><strong>${esc(o.orderName)}</strong></td>
      <td>${esc(o.customer?.name || o.customer?.email || '—')}</td>
      <td>${esc(o.routing?.facility || '—')}</td>
      <td>${o.needsProof ? 'yes' : 'no'}</td>
      <td class="mut">${fmtDate(o.createdAt)}</td>
      <td><span class="pill s-${esc(o.status)}">${esc(o.status)}</span></td>
    </tr>`).join('');
  $('rows').innerHTML = rows;
  $('empty').hidden = data.orders.length > 0;
  document.querySelectorAll('tr.row').forEach(tr =>
    tr.onclick = () => showDetail(tr.dataset.n));
}

async function showDetail(name) {
  const o = await api(`/orders/${encodeURIComponent(name)}`);
  const items = (o.items || []).map(it => `
    <tr><td>${esc(it.quantity)}×</td><td>${esc(it.name)} (${esc(it.sku)})</td>
        <td>${esc(it.widthFt)}×${esc(it.heightFt)} ft</td>
        <td>${esc((it.finishing || []).join(', '))}</td></tr>`).join('');
  const proofUrl = CONFIG.cdnBase ? `${CONFIG.cdnBase}/${encodeURIComponent(name)}/` : null;

  $('detail').innerHTML = `
    <h3>${esc(o.orderName)} <span class="pill s-${esc(o.status)}">${esc(o.status)}</span></h3>
    <dl>
      <dt>Customer</dt><dd>${esc(o.customer?.name || '—')} · ${esc(o.customer?.email || '')}</dd>
      <dt>Ship to</dt><dd>${esc(o.shipping?.state || '—')} ${esc(o.shipping?.postalCode || '')} · ${esc(o.shipping?.method || '')}</dd>
      <dt>Facility</dt><dd>${esc(o.routing?.facility || '—')} ${o.routing?.transport ? `(${esc(o.routing.transport)})` : ''}</dd>
      <dt>Total</dt><dd>$${esc(o.totals?.grandTotal ?? '—')} ${esc(o.totals?.currency || '')}</dd>
      <dt>Created</dt><dd>${fmtDate(o.createdAt)}</dd>
      <dt>Needs proof</dt><dd>${o.needsProof ? 'yes' : 'no'}</dd>
    </dl>
    ${items ? `<table class="items">${items}</table>` : ''}
    ${proofUrl && o.needsProof ? `<p><a href="${proofUrl}" target="_blank" rel="noopener">Open proof viewer ↗</a></p>` : ''}
    ${o.needsProof && o.status === 'processing' ? `
      <div class="actions">
        <button class="approve" id="btnApprove">Approve proof</button>
        <button class="reject"  id="btnReject">Reject</button>
        <input id="rejectReason" placeholder="Reject reason (optional)">
      </div>
      <p class="note">Approve resumes printing; Reject stops this order and alerts the team.</p>` : ''}
    <div class="err" id="actErr"></div>`;
  $('detail').hidden = false;

  const act = async (verb, body) => {
    try {
      $('btnApprove').disabled = $('btnReject').disabled = true;
      await api(`/orders/${encodeURIComponent(name)}/${verb}`, { method: 'POST', body: JSON.stringify(body || {}) });
      await loadList(); await showDetail(name);
    } catch (e) { $('actErr').textContent = e.message; $('btnApprove').disabled = $('btnReject').disabled = false; }
  };
  $('btnApprove')?.addEventListener('click', () => act('approve'));
  $('btnReject')?.addEventListener('click', () => act('reject', { reason: $('rejectReason').value || undefined }));
}

/* ------------------------------ boot ----------------------------------- */
$('signin').onclick = async () => {
  $('loginErr').textContent = '';
  try {
    token = await signIn($('email').value.trim(), $('password').value);
    $('who').textContent = $('email').value.trim();
    $('login').hidden = true; $('topbar').hidden = false; $('app').hidden = false;
    await loadList();
  } catch (e) { $('loginErr').textContent = e.message; }
};
$('password').addEventListener('keydown', e => { if (e.key === 'Enter') $('signin').click(); });
$('signout').onclick = () => location.reload();

// Load deploy-time config, then unlock the sign-in form.
(async function init() {
  try {
    const r = await fetch('config.json', { cache: 'no-store' });
    if (r.ok) CONFIG = { ...CONFIG, ...(await r.json()) };
  } catch { /* opened as a bare file — CONFIG stays empty */ }
  if (!CONFIG.apiBase || !CONFIG.userPoolClientId) {
    $('loginErr').textContent = 'Not configured yet — this page must be served by the deployed webapp stack.';
    $('signin').disabled = true;
  }
})();
</script>
</body>
</html>
