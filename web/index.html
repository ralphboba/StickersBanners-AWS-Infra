<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg:#eef1f5; --surface:#fff; --surface-2:#f7f9fb; --rail:#f1f4f8;
    --ink:#16202e; --muted:#5f6f82; --faint:#8496a8; --line:#e2e7ee;
    --accent:#2f6feb; --accent-soft:#e5edfd;
    --s-queue:#2563eb; --s-print:#d97706; --s-proof:#7c3aed; --s-review:#c0392b; --s-admin:#475569;
    --s-pay:#e11d48; --s-pickup:#0d9488; --s-ship:#0369a1; --s-done:#16a34a; --s-hold:#dc2626;
    --shadow:0 1px 2px rgba(16,32,46,.06), 0 8px 24px rgba(16,32,46,.06);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0d131c; --surface:#141d29; --surface-2:#111a25; --rail:#101823;
    --ink:#e6edf5; --muted:#93a4b8; --faint:#6b7f95; --line:#233040;
    --accent:#5b8def; --accent-soft:#17263f;
    --s-queue:#5b8def; --s-print:#e0a44a; --s-proof:#a17bef; --s-review:#e06666; --s-admin:#7688a0;
    --s-pay:#f2557a; --s-pickup:#2bb3a3; --s-ship:#4aa3dd; --s-done:#3fce74; --s-hold:#ef5350;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --bg:#0d131c; --surface:#141d29; --surface-2:#111a25; --rail:#101823;
    --ink:#e6edf5; --muted:#93a4b8; --faint:#6b7f95; --line:#233040;
    --accent:#5b8def; --accent-soft:#17263f;
    --s-queue:#5b8def; --s-print:#e0a44a; --s-proof:#a17bef; --s-review:#e06666; --s-admin:#7688a0;
    --s-pay:#f2557a; --s-pickup:#2bb3a3; --s-ship:#4aa3dd; --s-done:#3fce74; --s-hold:#ef5350;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  .mono { font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  button { font:inherit; }

  /* login */
  #login { max-width:360px; margin:12vh auto; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:28px; box-shadow:var(--shadow); }
  #login h1 { font-size:19px; margin:0 0 4px; }
  #login p { color:var(--muted); margin:0 0 18px; font-size:13px; }
  #login label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  #login input { width:100%; border:1px solid var(--line); background:var(--surface-2);
    color:var(--ink); border-radius:9px; padding:10px 12px; font:inherit; outline:none; }
  #login input:focus { border-color:var(--accent); }
  #login button { width:100%; margin-top:18px; background:var(--accent); color:#fff; border:0;
    border-radius:9px; padding:11px; font-weight:600; cursor:pointer; }
  .err { color:var(--s-hold); font-size:13px; min-height:18px; margin-top:10px; }

  /* app */
  .top { display:flex; align-items:center; gap:16px; padding:12px 20px;
    background:var(--surface); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:-.01em; }
  .brand .dot { width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,var(--accent),#8ab0ff); }
  .top .spacer { flex:1; }
  .who { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--muted); }
  .avatar { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff;
    display:grid; place-items:center; font-weight:600; font-size:12px; }
  .signout { background:var(--surface-2); border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:7px 12px; cursor:pointer; }

  .shell { display:grid; grid-template-columns:250px 1fr; min-height:calc(100vh - 53px); }
  .rail { background:var(--rail); border-right:1px solid var(--line); padding:16px 12px; }
  .rail h2 { font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--faint);
    margin:6px 8px 10px; font-weight:600; }
  .folder { display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:8px;
    border:0; background:transparent; color:var(--ink); cursor:pointer; text-align:left; margin-bottom:2px; }
  .folder:hover { background:var(--surface); }
  .folder.on { background:var(--surface); box-shadow:var(--shadow); font-weight:600; }
  .folder .tick { width:8px; height:8px; border-radius:50%; flex:none; }
  .folder .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .folder .ct { font-size:12px; color:var(--muted); background:var(--surface-2); border-radius:20px;
    padding:1px 8px; min-width:24px; text-align:center; }
  .folder.on .ct { background:var(--accent-soft); color:var(--accent); }
  .rail .sep { height:1px; background:var(--line); margin:10px 8px; }

  .main { padding:20px 24px; min-width:0; }
  .head { display:flex; align-items:baseline; gap:12px; margin-bottom:4px; }
  .head .tick { width:10px; height:10px; border-radius:50%; }
  .head h1 { font-size:20px; margin:0; letter-spacing:-.02em; }
  .head .sub { color:var(--muted); font-size:13px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); overflow:hidden; margin-top:14px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:640px; }
  thead th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--faint); font-weight:600; padding:11px 14px; border-bottom:1px solid var(--line); }
  tbody td { padding:12px 14px; border-bottom:1px solid var(--line); font-size:13.5px; }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr { cursor:pointer; } tbody tr:hover { background:var(--surface-2); }
  .ordno { font-weight:600; }
  .fac { font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); }
  .proofyes { color:var(--s-proof); font-weight:600; } .proofno { color:var(--faint); }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  .loading { padding:40px; text-align:center; color:var(--faint); }

  .drawer { position:fixed; top:0; right:0; height:100vh; width:400px; max-width:92vw;
    background:var(--surface); border-left:1px solid var(--line); box-shadow:-12px 0 40px rgba(16,32,46,.14);
    transform:translateX(100%); transition:transform .22s ease; padding:22px; overflow-y:auto; z-index:20; }
  .drawer.open { transform:translateX(0); }
  @media (prefers-reduced-motion:reduce){ .drawer{ transition:none; } }
  .drawer .x { float:right; border:0; background:var(--surface-2); color:var(--muted);
    width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:16px; }
  .drawer h3 { margin:0 0 2px; font-size:18px; } .drawer .oid { color:var(--muted); font-size:13px; margin-bottom:14px; }
  dl { display:grid; grid-template-columns:104px 1fr; gap:8px 12px; margin:16px 0; font-size:13.5px; }
  dt { color:var(--faint); } dd { margin:0; }
  .proofbox { margin-top:16px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .proofbox .lab { font-size:12px; color:var(--muted); margin-bottom:10px; }
  .btns { display:flex; gap:9px; } .btn { flex:1; border:0; border-radius:9px; padding:10px; font-weight:600; cursor:pointer; }
  .btn.approve { background:var(--s-done); color:#fff; } .btn.reject { background:transparent; color:var(--s-hold); border:1px solid var(--s-hold); }
  .btn:disabled { opacity:.5; cursor:default; }
  .note { font-size:12px; color:var(--faint); margin-top:9px; }
  /* Special Instructions: staff edit + release (instructions.mjs) */
  .si { background:#fff7e0; border:1px solid #f0c766; border-radius:10px; padding:11px 13px; margin:4px 0 14px; }
  .si .silab { font-size:11px; font-weight:700; color:#92400e; text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
  .si .sitxt { font-size:14.5px; font-weight:600; color:#1f2937; white-space:pre-wrap; word-break:break-word; }
  .si .sitxt + .sitxt { margin-top:6px; }
  .si-item { font-size:13px; padding:8px 0 12px; border-bottom:1px solid var(--line); }
  .si-item:last-child { border-bottom:0; }
  .si-row { display:flex; gap:6px; align-items:center; margin:7px 0; flex-wrap:wrap; }
  .si-row .k { font-size:12px; color:var(--faint); width:62px; }
  .si-in { border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:7px; padding:5px 8px; font:inherit; font-size:12.5px; }
  input.si-in { width:62px; text-align:center; } select.si-in.wide { flex:1; min-width:0; }
  .si-in.chg { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .si-file { display:flex; gap:10px; align-items:center; margin-top:4px; }
  .si-file .lnk { color:var(--accent); font-weight:600; font-size:12.5px; text-decoration:none; }
  .si-up { display:inline-block; margin-top:5px; border:1.5px dashed #9fb3cc; border-radius:7px; padding:3px 9px; font-size:12px; color:var(--muted); cursor:pointer; }
  .si-up.done { border:1px solid var(--s-done); color:var(--s-done); background:#ecfdf3; font-weight:600; }
  .si-up.busy { border-style:solid; color:var(--accent); }
  .btn.plain { background:var(--surface); border:1px solid #b9c6d6; color:var(--ink); }
  .scrim { position:fixed; inset:0; background:rgba(8,14,22,.38); opacity:0; pointer-events:none; transition:opacity .2s; z-index:15; }
  .scrim.open { opacity:1; pointer-events:auto; }
  @media (max-width:720px){ .shell{ grid-template-columns:1fr; } .rail{ display:none; } }
</style>
</head>
<body>
<script>let CONFIG = { region:'us-east-1', apiBase:'', userPoolClientId:'', cdnBase:'' };</script>

<!-- LOGIN -->
<div id="login">
  <h1>StickersBanners Orders</h1>
  <p>Sign in to view and process orders.</p>
  <label>Username</label><input id="username" type="text" autocomplete="username">
  <label>Password</label><input id="password" type="password" autocomplete="current-password">
  <label class="remember" style="display:flex;align-items:center;gap:8px;font-weight:400;margin:14px 0 4px;cursor:pointer">
    <input id="remember" type="checkbox" checked style="width:auto;margin:0"> Keep me logged in</label>
  <button id="signin">Sign in</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- APP -->
<div id="app" hidden>
  <div class="top">
    <div class="brand"><span class="dot"></span> StickersBanners</div>
    <div class="search" style="display:flex;align-items:center;gap:8px;margin-left:18px">
      <input id="searchbox" type="text" placeholder="Search order #…" autocomplete="off"
        style="padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:13px;width:190px;outline:none">
      <button id="searchbtn" class="signout" style="cursor:pointer">Search</button>
      <input id="datebox" type="date" title="Show only orders created on this day"
        style="padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:13px;margin-left:6px">
      <button id="dateclear" class="signout" style="cursor:pointer" hidden>All dates</button>
      <span id="searchmsg" style="font-size:12px;color:var(--danger,#a63232)"></span>
    </div>
    <span class="spacer"></span>
    <div class="who"><span id="who"></span><span class="avatar" id="avatar">?</span></div>
    <button class="signout" id="signout">Sign out</button>
  </div>
  <div class="shell">
    <nav class="rail"><h2>Folders</h2><div id="folders"></div></nav>
    <main class="main">
      <div class="head"><span class="tick" id="headtick"></span><h1 id="headname">In Queue</h1><span class="sub" id="headsub"></span></div>
      <div class="card">
        <table><thead><tr>
          <th>Order</th><th>Customer</th><th>Facility</th><th>Proof</th><th>Created</th><th>Status</th>
        </tr></thead><tbody id="rows"></tbody></table>
        <div class="loading" id="loading" hidden>Loading…</div>
        <div class="empty" id="empty" hidden>No orders in this folder.</div>
      </div>
    </main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Order detail"></aside>

<script>
// OrderDesk folders — same names staff use today.
const FOLDERS = [
  { key:'in_queue',        name:'In Queue',                color:'--s-queue' },
  { key:'printing',        name:'Printing',                color:'--s-print' },
  { key:'proofing',        name:'Proofing',                color:'--s-proof' },
  { key:'needs_review',    name:'⚠ Needs Review',          color:'--s-review' },
  // Not a status of its own: the no-proof orders resize stopped because the
  // file looks the other way round from the order (Kai, 2026-10-07). They are
  // needs_review rows with hold.reason "size-swapped"; this folder shows them
  // apart so they are not lost among the intake holds. Proof orders are not
  // stopped -- they go to Proofing with a "size?" mark instead.
  { key:'size_check',      name:'↔ Size Check',            color:'--s-review', of:'needs_review' },
  // Orders the intake gate held because the customer typed special
  // instructions (Kai, 2026-10-11). Made by hand: the office attaches the final
  // print file per item and sends the order on -- instructions.mjs.
  { key:'special_instructions', name:'✎ Special Instructions', color:'--s-print', of:'needs_review' },
  { key:'awaiting_admin',  name:'Awaiting Admin Process',  color:'--s-admin' },
  { key:'awaiting_payment',name:'Awaiting Payment',        color:'--s-pay'   },
  // In Production / Awaiting Shipment / Awaiting Pickup / Completed were here.
  // Removed (Kai, 2026-10-11): staff follow those stages in OrderDesk. An
  // order in one of them still opens from the search box.
];
const FMAP = Object.fromEntries(FOLDERS.filter(f=>f.key).map(f=>[f.key,f]));
let token=null, current='in_queue', counts={};

const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = (iso)=> iso ? new Date(iso).toLocaleString() : '—';

/* auth: Cognito USER_PASSWORD_AUTH via plain fetch */
async function signIn(user, pass){
  const r = await fetch(`https://cognito-idp.${CONFIG.region}.amazonaws.com/`,{
    method:'POST',
    headers:{'content-type':'application/x-amz-json-1.1','x-amz-target':'AWSCognitoIdentityProviderService.InitiateAuth'},
    body:JSON.stringify({ AuthFlow:'USER_PASSWORD_AUTH', ClientId:CONFIG.userPoolClientId,
      AuthParameters:{ USERNAME:user, PASSWORD:pass } }),
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.message||'sign-in failed');
  if(!d.AuthenticationResult) throw new Error('extra challenge required — finish setup in the AWS console');
  return d.AuthenticationResult; // { IdToken, AccessToken, RefreshToken, ExpiresIn }
}
// Exchange a stored refresh token for a fresh IdToken (no password needed).
async function refreshSession(refreshToken){
  const r = await fetch(`https://cognito-idp.${CONFIG.region}.amazonaws.com/`,{
    method:'POST',
    headers:{'content-type':'application/x-amz-json-1.1','x-amz-target':'AWSCognitoIdentityProviderService.InitiateAuth'},
    body:JSON.stringify({ AuthFlow:'REFRESH_TOKEN_AUTH', ClientId:CONFIG.userPoolClientId,
      AuthParameters:{ REFRESH_TOKEN:refreshToken } }),
  });
  const d = await r.json();
  if(!r.ok || !d.AuthenticationResult) throw new Error('refresh failed');
  return d.AuthenticationResult.IdToken;
}
// "Keep me logged in" store (localStorage; guarded for private mode).
const RT_KEY='sb_rt', USER_KEY='sb_user';
function saveSession(rt,user){ try{ localStorage.setItem(RT_KEY,rt); localStorage.setItem(USER_KEY,user);}catch{} }
function clearSession(){ try{ localStorage.removeItem(RT_KEY); localStorage.removeItem(USER_KEY);}catch{} }
function storedRefresh(){ try{ return {rt:localStorage.getItem(RT_KEY), user:localStorage.getItem(USER_KEY)}; }catch{ return {}; } }

async function api(path, opts={}){
  const call=()=>fetch(CONFIG.apiBase+path, { ...opts,
    headers:{ authorization:`Bearer ${token}`, 'content-type':'application/json', ...(opts.headers||{}) } });
  let r = await call();
  if(r.status===401){
    // Try a silent refresh (keep-me-logged-in) before giving up.
    const {rt}=storedRefresh();
    if(rt){ try{ token=await refreshSession(rt); r=await call(); }catch{} }
    if(r.status===401){ clearSession(); location.reload(); return; }
  }
  // A cold start or a brief throttle shows up as 5xx. Retry once so a blip
  // doesn't blank the board until the next refresh.
  if(r.status>=500){ await new Promise(s=>setTimeout(s,600)); r=await call(); }
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||`HTTP ${r.status}`);
  return d;
}

function renderFolders(){
  const wrap=$('folders'); wrap.innerHTML='';
  for(const f of FOLDERS){
    if(f.sep){ const s=document.createElement('div'); s.className='sep'; wrap.appendChild(s); continue; }
    const b=document.createElement('button');
    b.className='folder'+(f.key===current?' on':'');
    const c = counts[f.key]==null ? '·' : counts[f.key];
    b.innerHTML=`<span class="tick" style="background:var(${f.color})"></span>
      <span class="nm">${f.name}</span><span class="ct">${c}</span>`;
    b.onclick=()=>{ current=f.key; loadFolder(); };
    wrap.appendChild(b);
  }
}
// One request for every folder count. Asking per folder meant 12 parallel
// calls on every 20s refresh, each paging a whole status just to read .count —
// that burst is what made the API return 503 now and then.
const isSizeCheck = (o)=> o.hold?.reason==='size-swapped' && !o.mirror;
const isSpecialInstr = (o)=> o.hold?.reason==='special-instructions' && !o.mirror;
const CARVED = { size_check:isSizeCheck, special_instructions:isSpecialInstr };
const isCarved = (o)=> Object.values(CARVED).some(fn=>fn(o));
const instrText = (o)=> (o.items||[]).map(it=>it.instructions).filter(Boolean).join(' | ');
async function loadCounts(){
  try{
    const d=await api('/orders?counts=1');
    for(const f of FOLDERS) if(f.key && !f.of) counts[f.key]=d.counts?.[f.key] ?? 0;
    // Size Check is carved out of needs_review, so count it from that list.
    try{
      const nr=await api('/orders?status=needs_review');
      counts.size_check=nr.orders.filter(isSizeCheck).length;
      counts.special_instructions=nr.orders.filter(isSpecialInstr).length;
      counts.needs_review=nr.count-counts.size_check-counts.special_instructions;
    }catch{ counts.size_check='—'; counts.special_instructions='—'; }
  }catch{
    // Fallback for a dashboard deployed ahead of the API. Remove once the
    // counts endpoint has shipped everywhere.
    await Promise.all(FOLDERS.filter(f=>f.key).map(async f=>{
      if(f.of) return;
      try { const d=await api(`/orders?status=${f.key}`); counts[f.key]=d.count; } catch { counts[f.key]='—'; }
    }));
  }
  renderFolders();
}
// Intake gate: the five checks the bot runs before it will touch an order
// (ported from Linh's program). An order that trips one is never processed —
// it is handed to staff instead. `preview:true` means nothing was moved in
// OrderDesk; it is showing what the bot WOULD do, because OrderDesk writes are
// still switched off while this runs alongside Linh's program.
const HOLD_LABEL={
  'special-product':'sales · special product',
  'multiple-files':'sales · multiple files',
  'special-instructions':'manual · has instructions',
  'dc-order':'manual · DC order',
  'missing-file':'manual · missing/bad file',
  'bad-artwork':'manual · file cannot print',
  'size-swapped':'check · size swapped?',
};
function holdPill(o){
  if(!o.hold||!o.hold.reason) return '';
  const label=HOLD_LABEL[o.hold.reason]||o.hold.reason;
  const tip=[o.hold.explain||'',o.hold.preview?'(preview — nothing moved in OrderDesk)':(o.hold.moveApplied?'(moved in OrderDesk)':'(OrderDesk write skipped)')].filter(Boolean).join(' ');
  return ` <span title="${esc(tip)}" style="margin-left:6px;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;color:#8a4b00;background:#fdf1df;border:1px solid #f0d3a8">⛔ ${esc(label)}${o.hold.preview?' ·<span style="font-weight:500"> would</span>':''}</span>`;
}
// A proof order whose file looks swapped is not stopped; it carries this mark
// so staff can look at the proof before the customer approves it.
function sizePill(o){
  if(!o.sizeSwap) return '';
  return ` <span title="${esc(o.sizeSwap.explain||'')}" style="margin-left:6px;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;color:#8a4b00;background:#fdf1df;border:1px solid #f0d3a8">↔ size?</span>`;
}
async function loadFolder(){
  renderFolders();
  const f=FMAP[current];
  $('headname').textContent=f.name; $('headtick').style.background=`var(${f.color})`;
  $('rows').innerHTML=''; $('empty').hidden=true; $('loading').hidden=false; $('headsub').textContent='';
  let data;
  try {
    data=await api(`/orders?status=${f.of||current}`);
    if(f.of || current==='needs_review'){
      const orders=data.orders.filter(o=> f.of ? CARVED[current](o) : !isCarved(o));
      data={...data, orders, count:orders.length};
    }
  }
  catch(e){
    // Keep the rows already on screen; only say something if there is nothing
    // to show. The next refresh is 20s away.
    $('loading').hidden=true;
    if(!$('rows').children.length) $('empty').hidden=false;
    return;
  }
  $('loading').hidden=true;
  counts[current]=data.count; renderFolders();
  // Date picker next to Search: only orders created that (local) day. It
  // opens on today (Kai, 2026-10-11) and follows the calendar while it is
  // still on "today" -- a page left open overnight moves to the new day.
  if(dateIsToday && $('datebox').value!==localDay(new Date())){ $('datebox').value=localDay(new Date()); $('dateclear').hidden=false; }
  const day=$('datebox').value;
  if(day){ const orders=data.orders.filter(o=>o.createdAt && localDay(o.createdAt)===day);
    data={...data, orders}; }
  $('headsub').textContent = day
    ? `${data.orders.length} of ${data.count} order${data.count!==1?'s':''} · created ${new Date(day+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}`
    : `${data.count} order${data.count!==1?'s':''}`;
  const rows=data.orders.map(o=>`
    <tr data-n="${esc(o.orderName)}">
      <td class="ordno mono">${esc(o.orderName)}${o.hasUnknownSku?` <span title="Unknown SKU — not set up yet, needs review" style="color:#a63232;font-weight:700">⚠</span>`:''}</td>
      <td>${esc(o.customer?.name||o.customer?.email||'—')}</td>
      <td class="fac">${esc(o.routing?.facility||'—')}</td>
      <td>${o.needsProof?'<span class="proofyes">● needs proof</span>':'<span class="proofno">—</span>'}</td>
      <td class="mono" style="color:var(--muted)">${fmtDate(o.createdAt)}</td>
      <td>${current==='special_instructions'
        ? `<span title="${esc(instrText(o))}" style="display:inline-block;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;color:var(--muted);font-size:12.5px">“${esc(instrText(o)||'open the order to read them')}”</span>`
        : `<span class="folder-pill" style="color:var(${f.color});font-weight:600;font-size:12px">${f.name}${o.status==='printing'&&o.stage?` <span style="color:var(--muted);font-weight:500">· ${esc(o.stage)}</span>`:''}</span>${holdPill(o)}${sizePill(o)}`}</td>
    </tr>`).join('');
  $('rows').innerHTML=rows;
  document.querySelector('thead th:last-child').textContent = current==='special_instructions' ? 'Instructions' : 'Status';
  $('empty').hidden=data.orders.length>0;
  document.querySelectorAll('#rows tr').forEach(tr=>tr.onclick=()=>showDetail(tr.dataset.n));
}
// Demo-only manual pipeline: the folders a DEMO-* order steps through, In Queue
// -> Printing -> Proofing -> Awaiting Pickup (its facility). Real orders never
// get these controls.
const isDemo=(name)=>/^(DEMO|ZZ)-/i.test(String(name||''));
function demoLadder(o){
  const fac=String(o.routing?.facility||'CA').toLowerCase();
  return ['in_queue','printing','proofing',`pickup_${fac}`];
}
async function demoMove(o,dir){
  const ladder=demoLadder(o);
  let i=ladder.indexOf(o.status);
  if(i<0) i = dir>0 ? -1 : ladder.length; // off-ladder -> step onto an end
  const j=Math.max(0,Math.min(ladder.length-1,i+dir));
  const status=ladder[j];
  if(status===o.status) return;
  try{ await api(`/orders/${encodeURIComponent(o.orderName)}/move`,{method:'POST',body:JSON.stringify({status})}); }
  catch(e){ const el=$('demoErr'); if(el) el.textContent=e.message; return; }
  await loadCounts();
  showDetail(o.orderName); // reopen on its new folder
}
/** Called as each missing thumbnail removes itself; the last one explains. */
function proofGone(){
  const box=document.getElementById('proofs'); if(!box) return;
  if(!box.querySelector('.proofitem')){ const n=box.querySelector('.noproof'); if(n) n.style.display='block'; }
}
async function showDetail(name){
  let o; try { o=await api(`/orders/${encodeURIComponent(name)}`); } catch(e){ return; }

  const items=(o.items||[]).map(it=>`<div style="font-size:13px;padding:4px 0;color:var(--muted)">

  // The proof files, named exactly as proofFiles() in
  // src/functions/proof-approval/core.mjs builds them for the customer page:
  // `{order}/{itemNo}-1v1.tif_review.jpg` and friends on the DZI CDN.
  //
  // This used to link `${cdnBase}/${order}/` -- an S3 "folder", which is not an
  // object, so S3 answered AccessDenied for EVERY order, processed or not. And
  // it was shown whenever needsProof was true, which only means an order WILL
  // need a proof: S64494, sitting In Queue and never processed, got the link.
  //
  // Each item's own thumbnail is shown and links to its full review image.
  // Whether a proof exists is decided by the file loading, not by guessing from

      ? `<p class="noproof" style="margin-top:12px;font-size:13px;color:var(--muted)">No proof from this system — this order is shown for reference only and is being handled by Linh's program.</p>`

  // Resize stopped this order: the file looks the other way round from the
  // order (customer uploaded 8x3, picked 3x8). Staff pick which is right; the

  const swapHold = o.status==='needs_review' && o.hold?.reason==='size-swapped' && !o.mirror;

  const sizeCard = (f)=>{
    const m=String(f.ordered||'').match(/^\s*([\d.]+)\s*x\s*([\d.]+)\s*(\w+)/i);

    const row=(lab,html)=>`<div style="margin:7px 0"><div style="color:var(--faint);font-size:11.5px;margin-bottom:2px">${lab}</div><div style="display:flex;align-items:center">${html}</div></div>`;

        ${f.hasPockets?'<br><span style="color:var(--s-hold)">Has pole pockets / stand base — confirm the layout with the customer before swapping.</span>':''}
      </div></div>`;
  };
  const sizeBox = swapHold ? `<div class="proofbox">
    <div class="lab"><b>Size may be swapped.</b> The customer's file is the other way round from what they ordered — wide where the order is tall, or tall where it is wide. Pick which one to print; the order then runs again from the start.</div>
    ${flagged.map(sizeCard).join('')}

      <button class="btn approve" id="szswap" ${pockets?'disabled title="Has pole pockets — confirm with the customer first"':''}>Swap${flagged.length===1?(()=>{const m=String(flagged[0].ordered||'').match(/^\s*([\d.]+)\s*x\s*([\d.]+)\s*(\w+)/i);return m?` — ${esc(m[2])}×${esc(m[1])} ${esc(m[3])} (W×H)`:'';})():''}</button>
      <button class="btn reject" id="szkeep">Keep as ordered${flagged.length===1?(()=>{const m=String(flagged[0].ordered||'').match(/^\s*([\d.]+)\s*x\s*([\d.]+)\s*(\w+)/i);return m?` — ${esc(m[1])}×${esc(m[2])} ${esc(m[3])} (W×H)`:'';})():''}</button>
    </div>
    <div class="err" id="szErr"></div></div>` : '';
  const swapNote = o.sizeSwap && !swapHold ? `<div class="proofbox">
    <div class="lab"><b>Size may be swapped.</b> This is a proof order, so it was not stopped: the proof shows it as ordered. Check the proof — the customer may want it the other way round.</div>
    ${(o.sizeSwap.items||[]).map(sizeCard).join('')}</div>` : '';
  // Special instructions: a person reads them, fixes what they ask for, and

  const siHold = o.status==='needs_review' && isSpecialInstr(o);
  const siItems = siHold ? (o.items||[]).map((it,i)=>({...it, no:String(it.itemNo??i+1)})) : [];
  const siTexts = siItems.filter(it=>it.instructions);
  const siBox = siHold ? `<div class="si"><div class="silab">Customer's special instructions</div>
      ${siTexts.length ? siTexts.map(it=>`<div class="sitxt">${siItems.length>1?`<span style="color:var(--muted);font-weight:500">Item ${esc(it.no)}: </span>`:''}“${esc(it.instructions)}”</div>`).join('')
        : `<div class="sitxt" style="font-weight:500;color:var(--muted)">The text was not recorded for this order — read it in OrderDesk.</div>`}</div>` : '';
  const siEditor = siHold ? siItems.map(it=>{ const art=it.customerArtworkUrl||it.artworkUrl||'';
    const isWeb=/^https?:/i.test(art);
    return `<div class="si-item" data-no="${esc(it.no)}">
      <b>${esc(it.quantity)}× ${esc(it.name||it.sku)}</b>
      <div style="color:var(--muted);margin:3px 0 8px">Ordered: ${esc(it.width)}×${esc(it.height)} ${esc(it.unit||'ft')}, ${esc(it.finishingRaw||'')}</div>
      <div class="si-file"><div style="font-size:12.5px">
        ${isWeb?`<a class="lnk" href="${esc(art)}" target="_blank" rel="noopener">⬇ Download customer file</a>`:'<span style="color:var(--faint)">Customer file not linkable</span>'}
        <span style="color:var(--faint)"> · .${esc(it.artworkExt||'?')}</span><br>
        <label class="si-up" data-up="${esc(it.no)}">⬆ Attach final print file<input type="file" hidden></label></div></div>
    </div>`; }).join('') : '';
  const fac = esc(o.routing?.facility||'the facility');
  const siAct = siHold ? `<div class="proofbox"><div class="lab">Make the print file by hand, then attach it to each item.
      <b>Nothing is resized or marked</b> — each file goes to ${fac} exactly as attached.</div>
      <div class="btns"><button class="btn approve" id="sigo" disabled>${o.needsProof?'Send proof to customer':`Send to ${fac}`}</button></div>
      <div class="note">${o.needsProof
        ? `The customer gets the proof email (Zendesk) with your files. When they approve, the files go to the ${fac} FTP folder and the order moves to the ${fac} folder in OrderDesk.`
        : `The files go to the ${fac} FTP folder and the order moves to the ${fac} folder in OrderDesk.`}
        <span id="sicount"></span></div>
      <div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)">Instructions don't change the print (PO number, shipping note)?
        <button class="btn plain" id="siasis" style="flex:none;padding:5px 10px;margin-left:6px;font-size:12px">Process as an ordinary order</button></div>
      <div class="err" id="siErr"></div></div>` : '';
  const demo = isDemo(o.orderName);
  const canSend = o.needsProof && o.status==='proofing' && !demo;
  // Demo controls: step this synthetic order forward/back through the pipeline.
  const ladder = demoLadder(o); const li = ladder.indexOf(o.status);
  const nextName = li>=0 && li<ladder.length-1 ? (FMAP[ladder[li+1]]?.name||ladder[li+1]) : null;
  const prevName = li>0 ? (FMAP[ladder[li-1]]?.name||ladder[li-1]) : null;
  const demoBox = demo ? `<div class="proofbox">
    <div class="lab">Demo controls — move this order through the pipeline by hand.</div>
    <div class="btns">
      <button class="btn reject" id="dback" ${prevName?'':'disabled'}>◀ ${prevName?esc(prevName):'Back'}</button>

      <div class="btns"><button class="btn approve" id="send">Send to production</button></div>
      <div class="err" id="actErr"></div></div>`:''}
    ${sizeBox}${swapNote}

  $('drawer').classList.add('open'); $('scrim').classList.add('open');
  if(demo){
    if($('dfwd')) $('dfwd').onclick=()=>demoMove(o,+1);

    };

    $('szkeep').onclick=()=>decide('keep','print as ordered (artwork stretched)');
  }
  if(siHold) wireRelease(o, siItems);
  if(canSend){
    $('send').onclick=async()=>{ try{ $('send').disabled=true;
      await api(`/orders/${encodeURIComponent(name)}/approve`,{method:'POST',body:'{}'});
      closeDrawer(); loadFolder(); loadCounts();
    }catch(e){ $('actErr').textContent=e.message; $('send').disabled=false; } };
  }
}
// Special instructions (instructions.mjs): the office makes the print file by
// hand and attaches it per item; the order then sends the proof (if asked for)
// and the files exactly as attached.
function wireRelease(o, siItems){
  const uploads={};
  const box=$('drawer');
  const total=siItems.length;
  const refresh=()=>{ const n=Object.keys(uploads).length;
    $('sigo').disabled = n<total;
    $('sicount').textContent = n<total ? `Enabled once every item has a file (${n} of ${total} attached).` : ''; };
  refresh();
  // Upload: a one-time URL from the API, then straight to S3 with progress.
  box.querySelectorAll('.si-up').forEach(lab=>{
    const input=lab.querySelector('input'); const no=lab.dataset.up;
    input.onchange=async()=>{
      const file=input.files[0]; if(!file) return;
      lab.classList.remove('done'); lab.classList.add('busy'); lab.firstChild.textContent='Uploading… ';
      delete uploads[no]; refresh(); $('siErr').textContent='';
      try{
        const u=await api(`/orders/${encodeURIComponent(o.orderName)}/upload`,{method:'POST',
          body:JSON.stringify({itemNo:no, filename:file.name, contentType:file.type||'application/octet-stream'})});
        await new Promise((res,rej)=>{ const x=new XMLHttpRequest(); x.open('PUT',u.url); x.setRequestHeader('content-type',u.contentType);
          x.upload.onprogress=e=>{ if(e.lengthComputable) lab.firstChild.textContent=`Uploading… ${Math.round(e.loaded*100/e.total)}% `; };
          x.onload=()=> x.status<300?res():rej(new Error(`upload failed (${x.status})`)); x.onerror=()=>rej(new Error('upload failed')); x.send(file); });
        uploads[no]=u.key;
        lab.classList.remove('busy'); lab.classList.add('done');
        lab.firstChild.textContent=`✓ ${file.name} · ${(file.size/1048576).toFixed(file.size>1048576?0:1)} MB `;
      }catch(e){ lab.classList.remove('busy'); lab.firstChild.textContent='⬆ Attach final print file '; $('siErr').textContent=e.message; }
      refresh();
    };
  });
  const send=async(body,label)=>{
    if(!confirm(`${o.orderName}: ${label}?`)) return;
    $('siasis').disabled=true; $('sigo').disabled=true; $('siErr').textContent='';
    try{ await api(`/orders/${encodeURIComponent(o.orderName)}/release`,{method:'POST',body:JSON.stringify(body)});
      closeDrawer(); loadFolder(); loadCounts();
    }catch(e){ $('siErr').textContent=e.message; $('siasis').disabled=false; refresh(); }
  };
  $('sigo').onclick=()=>send({mode:'final',items:Object.entries(uploads).map(([itemNo,uploadKey])=>({itemNo,uploadKey}))},
    o.needsProof?'send the proof of your files to the customer':`send your files to ${o.routing?.facility||'the facility'}`);
  $('siasis').onclick=()=>{
    if(Object.keys(uploads).length && !confirm('Your attached files will NOT be used. Continue?')) return;
    send({mode:'as-is'},'process it as an ordinary order (the system makes the print file)');
  };
}

function enterApp(u){

// Auto-refresh: new orders arrive on their own, so re-pull counts + the current
// folder every 30s. Skips while a detail drawer is open so it isn't disruptive.
let refreshTimer=null;
function startAutoRefresh(){
  if(refreshTimer) return;
  refreshTimer=setInterval(()=>{
    if(document.hidden) return;
    if($('drawer').classList.contains('open')) { loadCounts(); return; }
    loadFolder(); loadCounts();
  }, 20000);
}
$('password').addEventListener('keydown',e=>{ if(e.key==='Enter') $('signin').click(); });
// Search an order # -> jump to the folder it's in and open its detail.
async function searchOrder(){
  const name=$('searchbox').value.trim();
  $('searchmsg').textContent='';
  if(!name) return;
  let o;
  try { o=await api(`/orders/${encodeURIComponent(name)}`); }
  catch(e){ $('searchmsg').textContent=`"${name}" not found`; return; }
  if(o && o.status){
    // Statuses without a folder here (production, pickup, completed) just
    // open the order where the list already is.
    if(FMAP[o.status]){ current=o.status; await loadFolder(); }
    showDetail(o.orderName||name);
    $('searchmsg').textContent='';
  } else {
    $('searchmsg').textContent=`"${name}" not found`;
  }
}
$('searchbtn').onclick=searchOrder;
/** YYYY-MM-DD of a timestamp in the viewer's own time zone. */
function localDay(iso){ const d=new Date(iso); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
let dateIsToday=true;
$('datebox').onchange=()=>{ dateIsToday = $('datebox').value===localDay(new Date());
  $('dateclear').hidden=!$('datebox').value; loadFolder(); };
$('dateclear').onclick=()=>{ dateIsToday=false; $('datebox').value=''; $('dateclear').hidden=true; loadFolder(); };
$('searchbox').addEventListener('keydown',e=>{ if(e.key==='Enter') searchOrder(); });

$('signout').onclick=()=>{ clearSession(); location.reload(); };

(async function init(){
  try{ const r=await fetch('config.json',{cache:'no-store'}); if(r.ok) CONFIG={...CONFIG,...(await r.json())}; }catch{}
  if(!CONFIG.apiBase||!CONFIG.userPoolClientId){
    $('loginErr').textContent='Not configured — this page must be served by the deployed webapp stack.';
    $('signin').disabled=true;
    return;
  }
  // Keep me logged in: if we have a stored refresh token, sign in silently.
  const {rt,user}=storedRefresh();
  if(rt){
    try{ token=await refreshSession(rt); enterApp(user||'kai'); return; }
    catch{ clearSession(); }
  }
})();
</script>
