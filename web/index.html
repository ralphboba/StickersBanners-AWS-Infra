<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg:#eef1f5; --surface:#fff; --surface-2:#f7f9fb; --rail:#f1f4f8;
    --ink:#16202e; --muted:#5f6f82; --faint:#8496a8; --line:#e2e7ee;
    --accent:#2f6feb; --accent-soft:#e5edfd;
    --s-queue:#2563eb; --s-print:#d97706; --s-proof:#7c3aed; --s-admin:#475569;
    --s-pay:#e11d48; --s-pickup:#0d9488; --s-done:#16a34a; --s-hold:#dc2626;
    --shadow:0 1px 2px rgba(16,32,46,.06), 0 8px 24px rgba(16,32,46,.06);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0d131c; --surface:#141d29; --surface-2:#111a25; --rail:#101823;
    --ink:#e6edf5; --muted:#93a4b8; --faint:#6b7f95; --line:#233040;
    --accent:#5b8def; --accent-soft:#17263f;
    --s-queue:#5b8def; --s-print:#e0a44a; --s-proof:#a17bef; --s-admin:#7688a0;
    --s-pay:#f2557a; --s-pickup:#2bb3a3; --s-done:#3fce74; --s-hold:#ef5350;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }}
  :root[data-theme="dark"]{
    --bg:#0d131c; --surface:#141d29; --surface-2:#111a25; --rail:#101823;
    --ink:#e6edf5; --muted:#93a4b8; --faint:#6b7f95; --line:#233040;
    --accent:#5b8def; --accent-soft:#17263f;
    --s-queue:#5b8def; --s-print:#e0a44a; --s-proof:#a17bef; --s-admin:#7688a0;
    --s-pay:#f2557a; --s-pickup:#2bb3a3; --s-done:#3fce74; --s-hold:#ef5350;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
    font-family:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  .mono { font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  button { font:inherit; }

  /* login */
  #login { max-width:360px; margin:12vh auto; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:28px; box-shadow:var(--shadow); }
  #login h1 { font-size:19px; margin:0 0 4px; }
  #login p { color:var(--muted); margin:0 0 18px; font-size:13px; }
  #login label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  #login input { width:100%; border:1px solid var(--line); background:var(--surface-2);
    color:var(--ink); border-radius:9px; padding:10px 12px; font:inherit; outline:none; }
  #login input:focus { border-color:var(--accent); }
  #login button { width:100%; margin-top:18px; background:var(--accent); color:#fff; border:0;
    border-radius:9px; padding:11px; font-weight:600; cursor:pointer; }
  .err { color:var(--s-hold); font-size:13px; min-height:18px; margin-top:10px; }

  /* app */
  .top { display:flex; align-items:center; gap:16px; padding:12px 20px;
    background:var(--surface); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:-.01em; }
  .brand .dot { width:22px; height:22px; border-radius:6px; background:linear-gradient(135deg,var(--accent),#8ab0ff); }
  .top .spacer { flex:1; }
  .who { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--muted); }
  .avatar { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff;
    display:grid; place-items:center; font-weight:600; font-size:12px; }
  .signout { background:var(--surface-2); border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:7px 12px; cursor:pointer; }

  .shell { display:grid; grid-template-columns:250px 1fr; min-height:calc(100vh - 53px); }
  .rail { background:var(--rail); border-right:1px solid var(--line); padding:16px 12px; }
  .rail h2 { font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--faint);
    margin:6px 8px 10px; font-weight:600; }
  .folder { display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:8px;
    border:0; background:transparent; color:var(--ink); cursor:pointer; text-align:left; margin-bottom:2px; }
  .folder:hover { background:var(--surface); }
  .folder.on { background:var(--surface); box-shadow:var(--shadow); font-weight:600; }
  .folder .tick { width:8px; height:8px; border-radius:50%; flex:none; }
  .folder .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .folder .ct { font-size:12px; color:var(--muted); background:var(--surface-2); border-radius:20px;
    padding:1px 8px; min-width:24px; text-align:center; }
  .folder.on .ct { background:var(--accent-soft); color:var(--accent); }
  .rail .sep { height:1px; background:var(--line); margin:10px 8px; }

  .main { padding:20px 24px; min-width:0; }
  .head { display:flex; align-items:baseline; gap:12px; margin-bottom:4px; }
  .head .tick { width:10px; height:10px; border-radius:50%; }
  .head h1 { font-size:20px; margin:0; letter-spacing:-.02em; }
  .head .sub { color:var(--muted); font-size:13px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:12px;
    box-shadow:var(--shadow); overflow:hidden; margin-top:14px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:640px; }
  thead th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--faint); font-weight:600; padding:11px 14px; border-bottom:1px solid var(--line); }
  tbody td { padding:12px 14px; border-bottom:1px solid var(--line); font-size:13.5px; }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr { cursor:pointer; } tbody tr:hover { background:var(--surface-2); }
  .ordno { font-weight:600; }
  .fac { font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); }
  .proofyes { color:var(--s-proof); font-weight:600; } .proofno { color:var(--faint); }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  .loading { padding:40px; text-align:center; color:var(--faint); }

  .drawer { position:fixed; top:0; right:0; height:100vh; width:400px; max-width:92vw;
    background:var(--surface); border-left:1px solid var(--line); box-shadow:-12px 0 40px rgba(16,32,46,.14);
    transform:translateX(100%); transition:transform .22s ease; padding:22px; overflow-y:auto; z-index:20; }
  .drawer.open { transform:translateX(0); }
  @media (prefers-reduced-motion:reduce){ .drawer{ transition:none; } }
  .drawer .x { float:right; border:0; background:var(--surface-2); color:var(--muted);
    width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:16px; }
  .drawer h3 { margin:0 0 2px; font-size:18px; } .drawer .oid { color:var(--muted); font-size:13px; margin-bottom:14px; }
  dl { display:grid; grid-template-columns:104px 1fr; gap:8px 12px; margin:16px 0; font-size:13.5px; }
  dt { color:var(--faint); } dd { margin:0; }
  .proofbox { margin-top:16px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .proofbox .lab { font-size:12px; color:var(--muted); margin-bottom:10px; }
  .btns { display:flex; gap:9px; } .btn { flex:1; border:0; border-radius:9px; padding:10px; font-weight:600; cursor:pointer; }
  .btn.approve { background:var(--s-done); color:#fff; } .btn.reject { background:transparent; color:var(--s-hold); border:1px solid var(--s-hold); }
  .btn:disabled { opacity:.5; cursor:default; }
  .note { font-size:12px; color:var(--faint); margin-top:9px; }
  .scrim { position:fixed; inset:0; background:rgba(8,14,22,.38); opacity:0; pointer-events:none; transition:opacity .2s; z-index:15; }
  .scrim.open { opacity:1; pointer-events:auto; }
  @media (max-width:720px){ .shell{ grid-template-columns:1fr; } .rail{ display:none; } }
</style>
</head>
<body>
<script>let CONFIG = { region:'us-east-1', apiBase:'', userPoolClientId:'', cdnBase:'' };</script>

<!-- LOGIN -->
<div id="login">
  <h1>StickersBanners Orders</h1>
  <p>Sign in to view and process orders.</p>
  <label>Username</label><input id="username" type="text" autocomplete="username">
  <label>Password</label><input id="password" type="password" autocomplete="current-password">
  <label class="remember" style="display:flex;align-items:center;gap:8px;font-weight:400;margin:14px 0 4px;cursor:pointer">
    <input id="remember" type="checkbox" checked style="width:auto;margin:0"> Keep me logged in</label>
  <button id="signin">Sign in</button>
  <div class="err" id="loginErr"></div>
</div>

<!-- APP -->
<div id="app" hidden>
  <div class="top">
    <div class="brand"><span class="dot"></span> StickersBanners</div>
    <div class="search" style="display:flex;align-items:center;gap:8px;margin-left:18px">
      <input id="searchbox" type="text" placeholder="Search order #…" autocomplete="off"
        style="padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:13px;width:190px;outline:none">
      <button id="searchbtn" class="signout" style="cursor:pointer">Search</button>
      <span id="searchmsg" style="font-size:12px;color:var(--danger,#a63232)"></span>
    </div>
    <span class="spacer"></span>
    <div class="who"><span id="who"></span><span class="avatar" id="avatar">?</span></div>
    <button class="signout" id="signout">Sign out</button>
  </div>
  <div class="shell">
    <nav class="rail"><h2>Folders</h2><div id="folders"></div></nav>
    <main class="main">
      <div class="head"><span class="tick" id="headtick"></span><h1 id="headname">In Queue</h1><span class="sub" id="headsub"></span></div>
      <div class="card">
        <table><thead><tr>
          <th>Order</th><th>Customer</th><th>Facility</th><th>Proof</th><th>Created</th><th>Status</th>
        </tr></thead><tbody id="rows"></tbody></table>
        <div class="loading" id="loading" hidden>Loading…</div>
        <div class="empty" id="empty" hidden>No orders in this folder.</div>
      </div>
    </main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Order detail"></aside>

<script>
// OrderDesk folders — same names staff use today.
const FOLDERS = [
  { key:'in_queue',        name:'In Queue',                color:'--s-queue' },
  { key:'printing',        name:'Printing',                color:'--s-print' },
  { key:'proofing',        name:'Proofing',                color:'--s-proof' },
  { key:'awaiting_admin',  name:'Awaiting Admin Process',  color:'--s-admin' },
  { key:'awaiting_payment',name:'Awaiting Payment',        color:'--s-pay'   },
  { sep:true },
  { key:'pickup_ga',       name:'Awaiting Pickup (GA)',    color:'--s-pickup'},
  { key:'pickup_nj',       name:'Awaiting Pickup (NJ)',    color:'--s-pickup'},
  { key:'pickup_tx',       name:'Awaiting Pickup (TX)',    color:'--s-pickup'},
  { key:'pickup_nv',       name:'Awaiting Pickup (NV)',    color:'--s-pickup'},
  { key:'pickup_ca',       name:'Awaiting Pickup (CA)',    color:'--s-pickup'},
  { sep:true },
  { key:'completed',       name:'Completed',               color:'--s-done'  },
];
const FMAP = Object.fromEntries(FOLDERS.filter(f=>f.key).map(f=>[f.key,f]));
let token=null, current='in_queue', counts={};

const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate = (iso)=> iso ? new Date(iso).toLocaleString() : '—';

/* auth: Cognito USER_PASSWORD_AUTH via plain fetch */
async function signIn(user, pass){
  const r = await fetch(`https://cognito-idp.${CONFIG.region}.amazonaws.com/`,{
    method:'POST',
    headers:{'content-type':'application/x-amz-json-1.1','x-amz-target':'AWSCognitoIdentityProviderService.InitiateAuth'},
    body:JSON.stringify({ AuthFlow:'USER_PASSWORD_AUTH', ClientId:CONFIG.userPoolClientId,
      AuthParameters:{ USERNAME:user, PASSWORD:pass } }),
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.message||'sign-in failed');
  if(!d.AuthenticationResult) throw new Error('extra challenge required — finish setup in the AWS console');
  return d.AuthenticationResult; // { IdToken, AccessToken, RefreshToken, ExpiresIn }
}
// Exchange a stored refresh token for a fresh IdToken (no password needed).
async function refreshSession(refreshToken){
  const r = await fetch(`https://cognito-idp.${CONFIG.region}.amazonaws.com/`,{
    method:'POST',
    headers:{'content-type':'application/x-amz-json-1.1','x-amz-target':'AWSCognitoIdentityProviderService.InitiateAuth'},
    body:JSON.stringify({ AuthFlow:'REFRESH_TOKEN_AUTH', ClientId:CONFIG.userPoolClientId,
      AuthParameters:{ REFRESH_TOKEN:refreshToken } }),
  });
  const d = await r.json();
  if(!r.ok || !d.AuthenticationResult) throw new Error('refresh failed');
  return d.AuthenticationResult.IdToken;
}
// "Keep me logged in" store (localStorage; guarded for private mode).
const RT_KEY='sb_rt', USER_KEY='sb_user';
function saveSession(rt,user){ try{ localStorage.setItem(RT_KEY,rt); localStorage.setItem(USER_KEY,user);}catch{} }
function clearSession(){ try{ localStorage.removeItem(RT_KEY); localStorage.removeItem(USER_KEY);}catch{} }
function storedRefresh(){ try{ return {rt:localStorage.getItem(RT_KEY), user:localStorage.getItem(USER_KEY)}; }catch{ return {}; } }

async function api(path, opts={}){
  const call=()=>fetch(CONFIG.apiBase+path, { ...opts,
    headers:{ authorization:`Bearer ${token}`, 'content-type':'application/json', ...(opts.headers||{}) } });
  let r = await call();
  if(r.status===401){
    // Try a silent refresh (keep-me-logged-in) before giving up.
    const {rt}=storedRefresh();
    if(rt){ try{ token=await refreshSession(rt); r=await call(); }catch{} }
    if(r.status===401){ clearSession(); location.reload(); return; }
  }
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||`HTTP ${r.status}`);
  return d;
}

function renderFolders(){
  const wrap=$('folders'); wrap.innerHTML='';
  for(const f of FOLDERS){
    if(f.sep){ const s=document.createElement('div'); s.className='sep'; wrap.appendChild(s); continue; }
    const b=document.createElement('button');
    b.className='folder'+(f.key===current?' on':'');
    const c = counts[f.key]==null ? '·' : counts[f.key];
    b.innerHTML=`<span class="tick" style="background:var(${f.color})"></span>
      <span class="nm">${f.name}</span><span class="ct">${c}</span>`;
    b.onclick=()=>{ current=f.key; loadFolder(); };
    wrap.appendChild(b);
  }
}
async function loadCounts(){
  await Promise.all(FOLDERS.filter(f=>f.key).map(async f=>{
    try { const d=await api(`/orders?status=${f.key}`); counts[f.key]=d.count; } catch { counts[f.key]='—'; }
  }));
  renderFolders();
}
async function loadFolder(){
  renderFolders();
  const f=FMAP[current];
  $('headname').textContent=f.name; $('headtick').style.background=`var(${f.color})`;
  $('rows').innerHTML=''; $('empty').hidden=true; $('loading').hidden=false; $('headsub').textContent='';
  let data; try { data=await api(`/orders?status=${current}`); } catch(e){ $('loading').textContent=e.message; return; }
  $('loading').hidden=true;
  counts[current]=data.count; renderFolders();
  $('headsub').textContent=`${data.count} order${data.count!==1?'s':''}`;
  const rows=data.orders.map(o=>`
    <tr data-n="${esc(o.orderName)}">
      <td class="ordno mono">${esc(o.orderName)}</td>
      <td>${esc(o.customer?.name||o.customer?.email||'—')}</td>
      <td class="fac">${esc(o.routing?.facility||'—')}</td>
      <td>${o.needsProof?'<span class="proofyes">● needs proof</span>':'<span class="proofno">—</span>'}</td>
      <td class="mono" style="color:var(--muted)">${fmtDate(o.createdAt)}</td>
      <td><span class="folder-pill" style="color:var(${f.color});font-weight:600;font-size:12px">${f.name}${o.status==='printing'&&o.stage?` <span style="color:var(--muted);font-weight:500">· ${esc(o.stage)}</span>`:''}</span></td>
    </tr>`).join('');
  $('rows').innerHTML=rows;
  $('empty').hidden=data.orders.length>0;
  document.querySelectorAll('#rows tr').forEach(tr=>tr.onclick=()=>showDetail(tr.dataset.n));
}
async function showDetail(name){
  let o; try { o=await api(`/orders/${encodeURIComponent(name)}`); } catch(e){ return; }
  const f=FMAP[o.status]||{name:o.status,color:'--muted'};
  const items=(o.items||[]).map(it=>`<div style="font-size:13px;padding:4px 0;color:var(--muted)">
    <b style="color:var(--ink)">${esc(it.quantity)}× ${esc(it.name||it.sku)}</b> — ${esc(it.width)}×${esc(it.height)} ${esc(it.unit||'ft')}, ${esc((it.finishingRaw)||'')}</div>`).join('');
  const proofUrl = CONFIG.cdnBase ? `${CONFIG.cdnBase}/${encodeURIComponent(name)}/` : null;
  const canSend = o.needsProof && o.status==='proofing';
  $('drawer').innerHTML=`
    <button class="x" onclick="closeDrawer()">×</button>
    <h3 class="mono">${esc(o.orderName)}</h3><div class="oid">${esc(f.name)}</div>
    <dl>
      <dt>Customer</dt><dd>${esc(o.customer?.name||'—')}<br><span style="color:var(--muted)">${esc(o.customer?.email||'')}</span></dd>
      <dt>Ship to</dt><dd>${esc(o.shipping?.state||'—')} ${esc(o.shipping?.postalCode||'')} · ${esc(o.shipping?.method||'')}</dd>
      <dt>Facility</dt><dd>${esc(o.routing?.facility||'—')} ${o.routing?.transport?`(${esc(o.routing.transport)})`:''}</dd>
      <dt>Total</dt><dd>$${esc(o.totals?.grandTotal??'—')} ${esc(o.totals?.currency||'')}</dd>
      <dt>Created</dt><dd>${fmtDate(o.createdAt)}</dd>
    </dl>
    <div style="border-top:1px solid var(--line);padding-top:12px">${items||'<span style="color:var(--faint)">No line items</span>'}</div>
    ${proofUrl&&o.needsProof?`<p style="margin-top:12px"><a href="${proofUrl}" target="_blank" rel="noopener" style="color:var(--accent)">Open proof viewer ↗</a></p>`:''}
    ${canSend?`<div class="proofbox"><div class="lab">In Proofing. Send to production once the customer has confirmed the proof (revisions come in by email).</div>
      <div class="btns"><button class="btn approve" id="send">Send to production</button></div>
      <div class="err" id="actErr"></div></div>`:''}`;
  $('drawer').classList.add('open'); $('scrim').classList.add('open');
  if(canSend){
    $('send').onclick=async()=>{ try{ $('send').disabled=true;
      await api(`/orders/${encodeURIComponent(name)}/approve`,{method:'POST',body:'{}'});
      closeDrawer(); loadFolder(); loadCounts();
    }catch(e){ $('actErr').textContent=e.message; $('send').disabled=false; } };
  }
}
function closeDrawer(){ $('drawer').classList.remove('open'); $('scrim').classList.remove('open'); }
$('scrim').onclick=closeDrawer;

function enterApp(u){
  $('who').textContent=u; $('avatar').textContent=(u[0]||'?').toUpperCase();
  $('login').hidden=true; $('app').hidden=false;
  loadFolder(); loadCounts();
  startAutoRefresh();
}
$('signin').onclick=async()=>{
  $('loginErr').textContent='';
  try{
    const u=$('username').value.trim();
    const auth=await signIn(u, $('password').value);
    token=auth.IdToken;
    if($('remember').checked && auth.RefreshToken) saveSession(auth.RefreshToken,u); else clearSession();
    enterApp(u);
  }catch(e){ $('loginErr').textContent=e.message; }
};

// Auto-refresh: new orders arrive on their own, so re-pull counts + the current
// folder every 30s. Skips while a detail drawer is open so it isn't disruptive.
let refreshTimer=null;
function startAutoRefresh(){
  if(refreshTimer) return;
  refreshTimer=setInterval(()=>{
    if(document.hidden) return;
    if($('drawer').classList.contains('open')) { loadCounts(); return; }
    loadFolder(); loadCounts();
  }, 20000);
}
$('password').addEventListener('keydown',e=>{ if(e.key==='Enter') $('signin').click(); });
// Search an order # -> jump to the folder it's in and open its detail.
async function searchOrder(){
  const name=$('searchbox').value.trim();
  $('searchmsg').textContent='';
  if(!name) return;
  let o;
  try { o=await api(`/orders/${encodeURIComponent(name)}`); }
  catch(e){ $('searchmsg').textContent=`"${name}" not found`; return; }
  if(o && o.status){
    current=o.status;
    await loadFolder();
    showDetail(o.orderName||name);
    $('searchmsg').textContent='';
  } else {
    $('searchmsg').textContent=`"${name}" not found`;
  }
}
$('searchbtn').onclick=searchOrder;
$('searchbox').addEventListener('keydown',e=>{ if(e.key==='Enter') searchOrder(); });

$('signout').onclick=()=>{ clearSession(); location.reload(); };

(async function init(){
  try{ const r=await fetch('config.json',{cache:'no-store'}); if(r.ok) CONFIG={...CONFIG,...(await r.json())}; }catch{}
  if(!CONFIG.apiBase||!CONFIG.userPoolClientId){
    $('loginErr').textContent='Not configured — this page must be served by the deployed webapp stack.';
    $('signin').disabled=true;
    return;
  }
  // Keep me logged in: if we have a stored refresh token, sign in silently.
  const {rt,user}=storedRefresh();
  if(rt){
    try{ token=await refreshSession(rt); enterApp(user||'kai'); return; }
    catch{ clearSession(); }
  }
})();
</script>
</body>
</html>
